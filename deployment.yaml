apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-app
  labels:
    app: my-python-app
spec:
  replicas: 2                          # Run 2 copies for reliability
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app
    spec:
      containers:
        - name: my-python-app
          image: $DOCKERHUB_USERNAME/my-python-app:latest
          ports:
            - containerPort: 5000
          livenessProbe:               # k8s restarts the pod if this fails
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: my-python-app-service
spec:
  selector:
    app: my-python-app
  type: LoadBalancer                   # Exposes it on localhost
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000